services:
  postgres:
    image: postgres:16-alpine
    container_name: beip_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persist data across container restarts
      - postgres-data:/var/lib/postgresql/data
      # Auto-run schema init on first boot
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beip}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
